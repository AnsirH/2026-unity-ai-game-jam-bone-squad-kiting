*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f4f1eb;color:#242925;font:15px/1.55 "Apple SD Gothic Neo",system-ui,sans-serif}header,main,footer{max-width:1040px;margin:auto;padding:28px 40px}header{padding-top:48px}h1{font-size:clamp(30px,5vw,56px);margin:0;letter-spacing:-.06em}h2{margin:52px 0 12px;font-size:26px;letter-spacing:-.04em}h3{margin:0;font-size:20px}header p{margin:8px 0}.nav{background:#253d35;position:sticky;top:0;z-index:1}.links{max-width:1040px;margin:auto;display:flex;gap:18px;padding:11px 40px;overflow:auto}.links a{color:white;text-decoration:none;white-space:nowrap;font-weight:650}section{scroll-margin-top:70px}article{background:#fffdf8;border:1px solid #d6d4c9;border-radius:10px;margin:10px 0;padding:20px 24px}.title,.actions,.take{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.title{justify-content:space-between}.dur,small{color:#54645c}.prompt{font:16px/1.55 system-ui,sans-serif;margin:13px 0;padding-left:14px;border-left:3px solid #9cb6a7}.actions{margin:14px 0 6px}button,.btn{font:inherit;font-weight:600;font-size:14px;cursor:pointer;border:1px solid #a6afa7;background:#fffdf8;color:#253d35;border-radius:6px;padding:6px 12px;text-decoration:none}button.primary{color:white;background:#28523f;border-color:#28523f}button:focus-visible,a:focus-visible{outline:3px solid #da8928}button:hover,.btn:hover{filter:brightness(.94)}.take{border-top:1px solid #e6e4dc;margin-top:9px;padding-top:8px}.take audio{height:31px;width:min(280px,100%)}.msg{color:#24543b;font-weight:650}.info{padding:12px 16px;background:#e5ece4;border-radius:6px;margin:12px 0}.over{outline:3px dashed #437e60}footer{padding-bottom:60px}main{padding-top:0}@media(max-width:630px){header,main,footer{padding-left:15px;padding-right:15px}.links{padding-left:15px}.prompt{font-size:15px}article{padding:16px}h2{font-size:22px}}
</style><header><h1>BSK 효과음 제작실</h1><p>영어 프롬프트를 ElevenLabs Sound Effects에 붙여 넣고, 같은 항목의 후보를 들어 본 뒤 선정하세요.</p><p><a class="btn" href="https://elevenlabs.io/app/sound-effects" target="_blank" rel="noopener">ElevenLabs Sound Effects 열기 ↗</a></p><div class="info" id="guide"></div><small>표시된 길이는 권장 설정입니다. 반복 재생을 끄고 한 번의 게임 이벤트에 맞춰 생성하세요.</small></header>
<nav class="nav"><div class="links"><a href="#g1">아군 분대</a><a href="#g2">불마법사 Q · R</a><a href="#g3">투창기사 W</a><a href="#g4">투석기 E</a><a href="#g5">보스 W 회전검기</a><a href="#g6">보스 E 낙검 · R 사방분열</a></div></nav><main id="main"></main><footer>Q 대형과 R 십자가 패턴은 같은 불씨 예고음과 불기둥 분출음을 사용합니다.</footer>
<script>
const cues=[{"id": "g1-01", "group": 1, "title": "아군 분대 사운드", "label": "석궁 발사", "stem": "01_석궁_발사", "path": "01_아군 분대 사운드", "duration": "0.4", "prompt": "One isolated medieval crossbow shot, heard close to the crossbowman. A tiny trigger click leads immediately into a tight dry bowstring snap and a short wooden stock vibration. Compact, crisp attack. End at the release, before flight or impact. Isolated game sound effect on silence, no music or ambient bed."}, {"id": "g1-02", "group": 1, "title": "아군 분대 사운드", "label": "화살 명중 · 갑옷과 대포", "stem": "02_화살_명중_갑옷과_대포", "path": "01_아군 분대 사운드", "duration": "0.6", "prompt": "A single crossbow bolt biting into thick metal armor or an iron cannon housing. Sharp pointed metal tick, a low hollow iron knock underneath, then a very short shiver of the lodged wooden shaft. Start directly on contact; keep the metal ring short. Isolated game sound effect on silence, no music or ambient bed."}, {"id": "g1-03", "group": 1, "title": "아군 분대 사운드", "label": "화살 명중 · 인간형 적", "stem": "03_화살_명중_인간형", "path": "01_아군 분대 사운드", "duration": "0.45", "prompt": "One crossbow bolt hits a cloth-covered humanoid enemy. A quick fabric catch and a muted, weighty thud land together, followed by a tiny shaft quiver. Dry, close and understated. No metal ring, voice, blood sounds or arrow flight. Isolated game sound effect on silence, no music or ambient bed."}, {"id": "g1-04", "group": 1, "title": "아군 분대 사운드", "label": "QWER 대형 전개 · 지휘 기합", "stem": "04_대형_전개_지휘_기합", "path": "01_아군 분대 사운드", "duration": "0.6", "prompt": "A single battle captain gives one short, forceful nonverbal command bark to change formation: “Hah!” Firm, clipped, disciplined, with a sharp onset that reads on a button press. Solo dry voice, no words, crowd response, or long battle cry. Isolated game sound effect on silence, no music or ambient bed."}, {"id": "g1-05", "group": 1, "title": "아군 분대 사운드", "label": "F · 뼈가 날아와 조립", "stem": "05_부활_뼈_집결과_조립", "path": "01_아군 분대 사운드", "duration": "1.4", "prompt": "Loose dry bones rush inward from a short distance. Several light rattles converge into a fast sequence of hollow clacks as a skeleton reassembles. Finish with one satisfying joint snapping into place. Rising inward motion; no magic chimes. Isolated game sound effect on silence, no music or ambient bed."}, {"id": "g1-06", "group": 1, "title": "아군 분대 사운드", "label": "F · 석궁병의 마력 부활", "stem": "06_부활_석궁병_마력", "path": "01_아군 분대 사운드", "duration": "1.3", "prompt": "A skeletal crossbowman channels restorative magic into a fallen squadmate. A focused low arcane pulse rises into a thin luminous shimmer and resolves with one clear, warm confirmation tone. Short and purposeful, separate from any physical bone assembly; no rattles or voices. Isolated game sound effect on silence, no music or ambient bed."}, {"id": "g1-07", "group": 1, "title": "아군 분대 사운드", "label": "피격 · 뼈가 분리되어 낙하", "stem": "07_피격_뼈_분리와_낙하", "path": "01_아군 분대 사운드", "duration": "1.1", "prompt": "A skeleton breaks apart from one hit. A short dry joint crack is followed by several hollow bones dropping onto stone, bouncing at uneven intervals, ending with one small loose bone rolling to rest. Downward, scattered motion; no magical shimmer or voice. Isolated game sound effect on silence, no music or ambient bed."}, {"id": "g2-01", "group": 2, "title": "불마법사 · Q 화염 / R 십자가", "label": "불씨가 땅을 그을리는 예고음", "stem": "01_불씨_지면_그을림", "path": "02_적 군대 사운드/01_불마법사_Q·R_공용", "duration": "1.4", "prompt": "A patch of embers quietly scorches the ground before a fire spell. Begin with a thin close sizzle; add a few isolated charcoal ticks and a slowly intensifying bed of heat. Cut just before ignition. No roar, explosion or eruption. Isolated game sound effect on silence, no music or ambient bed."}, {"id": "g2-02", "group": 2, "title": "불마법사 · Q 화염 / R 십자가", "label": "그을린 땅에서 솟는 불기둥", "stem": "02_불기둥_지면_분출", "path": "02_적 군대 사운드/01_불마법사_Q·R_공용", "duration": "1.5", "prompt": "A single pillar of fire bursts upward from scorched earth. An abrupt low ignition thump drives a rising, forceful rush of flame, followed by a brief crackling decay. Clearly vertical and explosive at the onset; no long warning buildup. Isolated game sound effect on silence, no music or ambient bed."}, {"id": "g3-01", "group": 3, "title": "투창기사 · W 패턴", "label": "스피어 투척 · 기합", "stem": "01_투창_기사_기합", "path": "02_적 군대 사운드/02_투창기사_W_패턴", "duration": "0.7", "prompt": "One deep, rough exertion grunt from a massive armored fantasy knight releasing a heavy spear. A tight intake of breath immediately breaks into one forceful, falling “Hrragh!” Keep it physical, solo and close. No words, weapon whoosh, or crowd. Isolated game sound effect on silence, no music or ambient bed."}, {"id": "g3-02", "group": 3, "title": "투창기사 · W 패턴", "label": "스피어 비행 · 바람 가르기", "stem": "02_투창_비행_바람", "path": "02_적 군대 사운드/02_투창기사_W_패턴", "duration": "0.85", "prompt": "One heavy, long spear cuts rapidly through the air. A focused rising hiss peaks in a sharp flyby, with a deeper air displacement trailing behind the metal point. A straight flight with a clean receding tail. No voice, magical split, or impact. Isolated game sound effect on silence, no music or ambient bed."}, {"id": "g3-03", "group": 3, "title": "투창기사 · W 패턴", "label": "스피어 마법 분열 · 두 갈래", "stem": "03_투창_마법_이중_분열", "path": "02_적 군대 사운드/02_투창기사_W_패턴", "duration": "0.9", "prompt": "One dark enchanted spear divides into two in midair. Start with a single tight crystalline crack, then two distinct thin blue-magic zips diverge in pitch and direction. Keep the split readable even in mono. No explosion or ground contact. Isolated game sound effect on silence, no music or ambient bed."}, {"id": "g3-04", "group": 3, "title": "투창기사 · W 패턴", "label": "스피어 착지 · 지면 긁힘", "stem": "04_투창_지면_관통과_긁힘", "path": "02_적 군대 사운드/02_투창기사_W_패턴", "duration": "1.0", "prompt": "A heavy iron spearhead strikes a rough stone floor at a shallow angle. Hard initial impact, a gritty short metal-on-stone scrape, then a lower final bite as the point wedges into a crack. A few tiny chips settle. No incoming flyby. Isolated game sound effect on silence, no music or ambient bed."}, {"id": "g4-01", "group": 4, "title": "투석기 · E 패턴", "label": "투석기 발사 · 나무 팔이 젖혀짐", "stem": "01_투석기_발사_나무_삐걱임", "path": "02_적 군대 사운드/03_투석기_E_패턴", "duration": "0.85", "prompt": "At the instant a medieval catapult launches, its heavy timber arm snaps forward with a strained wooden creak, a taut rope twang and one short wooden stop-knock. Make the timber creak the dominant sound. No boulder flight or impact. Isolated game sound effect on silence, no music or ambient bed."}, {"id": "g4-02", "group": 4, "title": "투석기 · E 패턴", "label": "투석 비행 · 다가오는 바람", "stem": "02_투석_비행_바람", "path": "02_적 군대 사운드/03_투석기_E_패턴", "duration": "1.3", "prompt": "A massive rough boulder approaches through the air. A distant, low rolling air roar swells into a broad turbulent rush, with a slow uneven pulse from its tumbling mass. Cut at closest approach, just before contact. No whistle, machinery or impact. Isolated game sound effect on silence, no music or ambient bed."}, {"id": "g4-03", "group": 4, "title": "투석기 · E 패턴", "label": "투석 충돌 · 바위와 지면", "stem": "03_투석_지면_충돌", "path": "02_적 군대 사운드/03_투석기_E_패턴", "duration": "1.5", "prompt": "A huge stone projectile slams into hard packed earth scattered with rock. A blunt low-frequency thump and crushed stone crunch land together, followed by a few smaller fragments bouncing and settling. Heavy and grounded; no fiery explosion or incoming wind. Isolated game sound effect on silence, no music or ambient bed."}, {"id": "g5-01", "group": 5, "title": "보스 · W 회전검기", "label": "검 휘두르기", "stem": "01_회전검기_검_휘두르기", "path": "03_보스몬스터 사운드/01_W_회전검기", "duration": "0.65", "prompt": "One massive greatsword sweeps in a tight arc close to the listener. A low rush of displaced air rises into a bright steel swish, then stops sharply as the swing finishes. A single heavy swing with a curved sense of motion. No projectile trail, blade impact, or grunt. Isolated fantasy game sound effect on silence. No music or ambient bed."}, {"id": "g5-02", "group": 5, "title": "보스 · W 회전검기", "label": "검기 비행 · 바람 가르기", "stem": "02_회전검기_비행_바람", "path": "03_보스몬스터 사운드/01_W_회전검기", "duration": "1.0", "prompt": "An airborne crescent of sword energy spins past the listener. Start with an approaching thin whistle; let a rippling blade-like flutter pass close by and recede into a short airy tail. Keep the spinning pulse audible in mono. No sword swing at the start or impact at the end. Isolated fantasy game sound effect on silence. No music or ambient bed."}, {"id": "g6-01", "group": 6, "title": "보스 · E 낙검 / R 사방분열", "label": "대검 공중 소환·분열 · 마력 발동", "stem": "01_대검_공중_소환과_분열_마력", "path": "03_보스몬스터 사운드/02_E_낙검_R_사방분열_공용", "duration": "1.0", "prompt": "Dark magic suspends a giant spectral sword in midair. A low resonant hum tightens, then one crisp crystalline snap blossoms into layered metallic overtones as the blade splits into copies. Let the overtones hang briefly, then cut to silence. A compact warning cue before the blades move. No falling rush or impact. Isolated fantasy game sound effect on silence. No music or ambient bed."}, {"id": "g6-02", "group": 6, "title": "보스 · E 낙검 / R 사방분열", "label": "대검 낙하 · 바람 가르기", "stem": "02_대검_낙하_바람", "path": "03_보스몬스터 사운드/02_E_낙검_R_사방분열_공용", "duration": "0.8", "prompt": "A massive greatsword falls point-first from overhead. Begin with a distant airy hiss that rapidly swells into a dense downward rush, edged by a thin metallic whistle. Cut abruptly at peak speed just before contact. One falling blade, a centered sound suitable for layering. No magic chime or impact. Isolated fantasy game sound effect on silence. No music or ambient bed."}, {"id": "g6-03", "group": 6, "title": "보스 · E 낙검 / R 사방분열", "label": "대검 지면 충돌", "stem": "03_대검_지면_충돌", "path": "03_보스몬스터 사운드/02_E_낙검_R_사방분열_공용", "duration": "1.2", "prompt": "A massive greatsword strikes a stone floor point-first. A sharp steel-on-stone crack lands over a deep compact thud; a brief resonant blade vibration and a few stone chips settling follow. Start on contact, with a tight decay that stays clear when several hits overlap. No lead-in, explosion, or falling whistle. Isolated fantasy game sound effect on silence. No music or ambient bed."}];
const local=location.protocol==='http:'&&location.hostname==='127.0.0.1', token='__SESSION_TOKEN__', takes=new Map(),inputs=new Map(),area=new Map(),notes=new Map();
function el(tag,value,css){const x=document.createElement(tag);if(value)x.textContent=value;if(css)x.className=css;return x}
function button(name,fn,css){const b=el('button',name,css);b.onclick=async()=>{try{await fn()}catch(e){alert(e.message)}};return b}
async function api(route,data,raw){const r=await fetch('/'+route,{method:'POST',headers:{'X-Session':token,'Content-Type':raw?'audio/mpeg':'application/json'},body:raw||JSON.stringify(data)});if(!r.ok)throw Error(await r.text());return r.json()}
const guide=document.querySelector('#guide');
guide.textContent=local?'‘복사 · 다운로드 수집’을 누르면 이후 다운로드된 ElevenLabs MP3가 해당 항목의 후보 폴더로 복사됩니다. 출처가 표시되지 않는 MP3는 항목에 끌어 놓으세요.':'자동 한글 분류와 선정본 저장은 같은 폴더의 ‘효과음_자동분류_열기.command’를 실행하세요. 여기서도 프롬프트 복사와 MP3 비교가 가능합니다.';
let active='';
function mark(id){active=id;document.querySelectorAll('[data-copy]').forEach(b=>b.textContent=(local&&id===b.dataset.copy)?'수집 중 · 프롬프트 다시 복사':(local?'복사 · 다운로드 수집':'프롬프트 복사'))}
async function copy(c){try{await navigator.clipboard.writeText(c.prompt)}catch{const t=document.createElement('textarea');t.value=c.prompt;document.body.append(t);t.select();const ok=document.execCommand('copy');t.remove();if(!ok)throw Error('프롬프트 본문을 선택해 복사하세요.')}if(local){await api('arm',{id:c.id});mark(c.id)}notes.get(c.id).textContent=local?'복사 완료 · 이 항목의 새 다운로드를 수집합니다.':'프롬프트를 복사했습니다.'}
function draw(c,list){const box=area.get(c.id);box.replaceChildren();for(const [i,t] of list.entries()){const line=el('div',null,'take'),label=el('span',t.name),player=el('audio');player.controls=true;player.preload='none';player.src=t.url;player.onplay=()=>document.querySelectorAll('audio').forEach(a=>{if(a!==player)a.pause()});line.append(label,player,button(local?'선정본 저장':'한글명으로 받기',async()=>{if(local){if(t.hasFinal&&!confirm('기존 선정본을 이 후보로 바꿀까요?'))return;await api('select',{id:c.id,name:t.name});notes.get(c.id).textContent='선정본 저장 완료 · '+c.path+'/'+c.stem+'.mp3';await sync()}else{const a=el('a');a.href=t.url;a.download=c.stem+'.mp3';a.click()}}));box.append(line)}}
async function add(c,files){for(const f of files){if(!/\.mp3$/i.test(f.name))throw Error('MP3 파일을 선택하세요.');if(local){await api('import?id='+c.id,null,f)}else{const list=takes.get(c.id)||[];list.push({name:f.name,url:URL.createObjectURL(f)});takes.set(c.id,list);draw(c,list)}}if(local)await sync()}
for(const c of cues){let group=document.querySelector('#g'+c.group);if(!group){group=el('section');group.id='g'+c.group;group.append(el('h2',c.title));if(c.group===2)group.append(el('p','Q와 R 십자가 패턴에서 아래 두 파일을 공용으로 사용합니다.'));if(c.group===6)group.append(el('p','E 낙검과 R 사방분열은 아래 세 음원을 함께 사용합니다.'));main.append(group)}const a=el('article'),head=el('div',null,'title'),p=el('p',c.prompt,'prompt');p.lang='en';head.append(el('h3',c.id.slice(-2)+'　'+c.label),el('span',c.duration+'초 권장','dur'));const btns=el('div',null,'actions'),input=el('input');input.type='file';input.accept='.mp3,audio/mpeg';input.multiple=true;input.hidden=true;input.onchange=async()=>{try{await add(c,input.files)}catch(e){alert(e.message)}input.value=''};const b=button('',()=>copy(c),'primary');b.dataset.copy=c.id;btns.append(b,button('MP3 후보 추가',()=>input.click()),input);const msg=el('small',null,'msg'),box=el('div');area.set(c.id,box);notes.set(c.id,msg);a.append(head,p,el('small','선정 파일　'+c.path+'/'+c.stem+'.mp3'),btns,msg,box);group.append(a);a.ondragover=e=>{e.preventDefault();a.classList.add('over')};a.ondragleave=()=>a.classList.remove('over');a.ondrop=async e=>{e.preventDefault();a.classList.remove('over');try{await add(c,e.dataTransfer.files)}catch(err){alert(err.message)}}}
let snapshots={};
async function sync(){const s=await api('state',{});mark(s.active);for(const c of cues){const files=s.files[c.id];const key=JSON.stringify(files);if(snapshots[c.id]!==key){draw(c,files);snapshots[c.id]=key}}}
mark('');if(local){sync().catch(e=>guide.textContent=e.message);setInterval(()=>sync().catch(()=>{}),2000)}
</script></html>
